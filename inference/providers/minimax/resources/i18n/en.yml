minimax_name: "MiniMax"
minimax_description: "MiniMax, founded in December 2021, is a leading general artificial intelligence technology company. MiniMax has independently developed large-scale models across different modalities, including the flagship M3 text model with a 512K token context window, speech models, and image models."
minimax_api_key_description: "Your MiniMax API Key for authentication."

minimax_m3_name: "MiniMax-M3"
minimax_m3_description: "MiniMax-M3 is MiniMax's latest flagship model with a 512K context window and 128K maximum output. It supports text and image input, function calling, and streaming. Ideal for complex reasoning, long-context understanding, and production workloads."

minimax_m2_7_name: "MiniMax-M2.7"
minimax_m2_7_description: "MiniMax-M2.7 is MiniMax's previous-generation flagship model with a 192K token context window. It supports text, vision, function calling, and streaming. Suitable for complex reasoning and long-context understanding."

minimax_m2_7_highspeed_name: "MiniMax-M2.7-highspeed"
minimax_m2_7_highspeed_description: "MiniMax-M2.7-highspeed is a faster, cost-efficient variant of M2.7 with the same 192K token context window. Optimized for high-throughput scenarios where speed and cost matter."

abab5_5_chat_name: "ABAB 5.5 Chat (Deprecated)"
abab5_5_chat_description: "ABAB 5.5 is a legacy large-scale language model developed by MiniMax. The total tokens limit for input and output is 16,384 tokens. Consider using MiniMax-M3 instead."

abab5_5s_chat_name: "ABAB 5.5s Chat (Deprecated)"
abab5_5s_chat_description: "ABAB 5.5s is a legacy smaller version of the ABAB 5.5 model. The total tokens limit for input and output is 8,192 tokens. Consider using MiniMax-M2.7-highspeed instead."

