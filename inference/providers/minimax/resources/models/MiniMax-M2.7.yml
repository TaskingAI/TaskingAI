model_schema_id: minimax/MiniMax-M2.7
provider_model_id: MiniMax-M2.7
type: chat_completion
name: "i18n:minimax_m2_7_name"
description: "i18n:minimax_m2_7_description"
default_endpoint_url: https://api.minimax.io/v1/chat/completions

properties:
  function_call: true
  streaming: true
  vision: true
  input_token_limit: 192000
  output_token_limit: 131072

config_schemas:
  - config_id: temperature
    type: float
    default: 0.7
    min: 0.01
    max: 1.0
    step: 0.01
  - config_id: top_p
  - config_id: max_tokens
    type: int
    default: 4096
    min: 1
    max: 131072
    step: 1

pricing:
  input_token: 0.001
  output_token: 0.008
  unit: 1000
  currency: CNY
