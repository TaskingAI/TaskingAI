model_schema_id: minimax/MiniMax-M3
provider_model_id: MiniMax-M3
type: chat_completion
name: "i18n:minimax_m3_name"
description: "i18n:minimax_m3_description"
default_endpoint_url: https://api.minimax.io/v1/chat/completions

properties:
  function_call: true
  streaming: true
  vision: true
  input_token_limit: 512000
  output_token_limit: 128000

config_schemas:
  - config_id: temperature
    type: float
    default: 0.7
    min: 0.01
    max: 1.0
    step: 0.01
  - config_id: top_p
  - config_id: max_tokens
    type: int
    default: 4096
    min: 1
    max: 128000
    step: 1

pricing:
  input_token: 0.0006
  output_token: 0.0024
  unit: 1000
  currency: USD
