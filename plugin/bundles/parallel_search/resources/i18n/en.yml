bundle_name: Parallel Search
bundle_description: Search the public web through Parallel Search. The provider receives the objective and queries. Anonymous access is rate-limited; no API key is required.
web_search_name: Web Search
web_search_description: Search the public web with Parallel Search MCP. The provider receives the objective and queries. Anonymous access is rate-limited; no API key is required.
web_search_input_objective_name: Objective
web_search_input_objective_description: A self-contained description of the information to find.
web_search_input_queries_name: Search queries
web_search_input_queries_description: One to five concise related queries, usually two or three, each no longer than 200 characters.
web_search_output_results_name: Results
web_search_output_results_description: JSON-encoded source results with URLs, excerpts, and optional titles and publish dates.
web_search_output_warnings_name: Warnings
web_search_output_warnings_description: JSON-encoded provider warnings, or an empty array when no warning was returned.
